// Generated by slidepulse.py install - remove with: slidepulse.py uninstall
// Sends `slidepulse event build-ok` or `event build-failed` when a build that assembles,
// bundles, builds or installs finishes. Cancelled builds, Android Studio sync (model-only
// builds) and other tasks are ignored.
// Uses dataflow actions, so it works with the configuration cache.
import org.gradle.api.flow.FlowAction
import org.gradle.api.flow.FlowParameters
import org.gradle.api.flow.FlowProviders
import org.gradle.api.flow.FlowScope
import org.gradle.api.provider.ListProperty
import org.gradle.api.provider.Property
import org.gradle.api.tasks.Input
import org.gradle.process.ExecOperations

import javax.inject.Inject

abstract class SlidePulseBuildDone implements FlowAction<Params> {
    interface Params extends FlowParameters {
        @Input
        Property<String> getOutcome()

        @Input
        ListProperty<String> getCommand()
    }

    @Inject
    abstract ExecOperations getExecOperations()

    @Override
    void execute(Params params) {
        String outcome = params.outcome.get()
        if (outcome == 'cancelled') {
            return
        }
        try {
            execOperations.exec { spec ->
                spec.commandLine(params.command.get() + [outcome == 'ok' ? 'build-ok' : 'build-failed'])
                spec.ignoreExitValue = true
                spec.standardOutput = OutputStream.nullOutputStream()
                spec.errorOutput = OutputStream.nullOutputStream()
            }
        } catch (Exception ignored) {
            // The LED must never fail a build.
        }
    }
}

abstract class SlidePulseSettingsPlugin implements Plugin<Settings> {
    @Inject
    abstract FlowScope getFlowScope()

    @Inject
    abstract FlowProviders getFlowProviders()

    @Override
    void apply(Settings settings) {
        def start = settings.gradle.startParameter
        if (start.projectProperties.containsKey('android.injected.build.model.only')) {
            return
        }
        if (!start.taskNames.any { it =~ /(?i)(assemble|bundle|build|install)/ }) {
            return
        }
        flowScope.always(SlidePulseBuildDone) { spec ->
            // Self-contained closure: the configuration cache does not keep its owner.
            spec.parameters.outcome.set(flowProviders.buildWorkResult.map { result ->
                String outcome = result.failure.present ? 'failed' : 'ok'
                for (Throwable t = result.failure.orElse(null); t != null; t = t.cause == t ? null : t.cause) {
                    if (t.getClass().simpleName.contains('Cancel')) {
                        outcome = 'cancelled'  // stopped by the user, not a broken build
                    }
                }
                outcome
            })
            spec.parameters.command.set({{COMMAND}})
        }
    }
}

gradle.settingsEvaluated { settings -> settings.pluginManager.apply(SlidePulseSettingsPlugin) }
