// Generated by slidepulse.py install - remove with: slidepulse.py uninstall
// Loads the slidepulse build hook on Gradle 8.1+ (it needs dataflow actions).
// Older Gradle versions, or a missing hook file, are skipped so no build ever fails.
def slidePulseHook = new File({{HOOK}})
if (org.gradle.util.GradleVersion.current().baseVersion >= org.gradle.util.GradleVersion.version('8.1')
        && slidePulseHook.isFile()) {
    apply from: slidePulseHook
}
